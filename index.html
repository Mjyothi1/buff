<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Cache Controls -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>BUFF - High-Protein Artisan Indulgence</title>
    <meta name="description" content="BUFF - India's premier high-protein artisan ice cream with Y2K neo-brutalist energy, 28g-34g protein per pint, and zero chalky guilt." />
    <meta property="og:title" content="BUFF - High-Protein Artisan Indulgence" />
    <meta property="og:description" content="BUFF - India's premier high-protein artisan ice cream with Y2K neo-brutalist energy, 28g-34g protein per pint, and zero chalky guilt." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- Anti-Cache Engine: Automatically upgrades old shared links -->
    <script>
      (function() {
        const currentUrl = new URL(window.location.href);
        // Checks if the user is using the old link format without our version key
        if (!currentUrl.searchParams.has('v')) {
          // Clear active service workers running the old app build
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (let registration of registrations) {
                registration.unregister();
              }
            });
          }
          // Append version control parameters to bypass internal mobile webview caches
          currentUrl.searchParams.set('v', 'build_' + Date.now());
          window.location.replace(currentUrl.toString());
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#121212] antialiased selection:bg-[#D4FF00] selection:text-[#121212]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
